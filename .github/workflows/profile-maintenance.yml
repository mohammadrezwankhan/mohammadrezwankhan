name: Profile maintenance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "README.md"
      - ".github/workflows/profile-maintenance.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/workflows/profile-maintenance.yml"
  schedule:
    - cron: "30 7 * * 1"

permissions: {}

jobs:
  link_check:
    name: Check profile links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check README links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --verbose
            --no-progress
            --exclude '^https://fr\.linkedin\.com/.*'
            README.md
          fail: true

  notify:
    name: Create maintenance issue
    needs: link_check
    if: ${{ always() && github.event_name == 'schedule' && needs.link_check.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Create maintenance issue on failure
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const title = "Profile maintenance: broken README link detected";
            const body = [
              "The scheduled profile maintenance workflow found a broken or unreachable link in `README.md`.",
              "",
              "Suggested next step:",
              "- Open the failed workflow run.",
              "- Identify the broken link.",
              "- Fix it in a small pull request.",
              "",
              "This workflow is designed to create real maintenance prompts, not empty contribution noise."
            ].join("\n");

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "profile-maintenance"
            });

            if (!existing.data.some(issue => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["profile-maintenance"]
              });
            }
